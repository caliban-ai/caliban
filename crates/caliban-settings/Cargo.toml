[package]
name        = "caliban-settings"
version.workspace = true
description = "Unified layered settings (managed > user > project > local) for caliban (ADR 0026) — internal crate for the caliban binary; no API stability, pin exact versions"
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde            = { workspace = true }
serde_json       = { workspace = true }
toml             = { workspace = true }
thiserror        = { workspace = true }
anyhow           = { workspace = true }
tracing          = { workspace = true }
arc-swap         = { workspace = true }
dirs             = { workspace = true }
url              = { workspace = true }
jsonschema       = { workspace = true }
notify           = { workspace = true }
tokio            = { workspace = true }
fs2              = { workspace = true }
caliban-common       = { workspace = true }
caliban-config-types = { workspace = true }
chrono             = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Tests only: `caliban-agent-core` owns `AgentConfig`, the `apply_*` overlay
# (ADR 0061 / #711), and the runtime `ToolCtx`/`permissions_matcher` these tests
# exercise. The settings *library* no longer depends on it — the layering edge is
# inverted (`caliban-agent-core` depends on `caliban-settings`, not the reverse).
caliban-agent-core = { workspace = true }
